services:
  - type: web
    name: clearpath-telemetry
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CLEARPATH_DB
        value: /tmp/clearpath.db
      - key: DEMO_ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '*'
